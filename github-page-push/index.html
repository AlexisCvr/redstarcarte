<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RedStarCarte</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RedStarCarte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#70c29b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html, body { margin:0; height:100%; background:#70c29b; overflow:hidden; }
  #bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 76px);display:none;z-index:5;padding:0 14px}
  #bar button{width:100%;padding:14px;border:0;border-radius:14px;background:#0e9956;color:#fff;font:700 16px system-ui,sans-serif;box-shadow:0 4px 16px #0006}
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#70c29b; }
</style>
</head>
<body>
<iframe id="app" title="RedStarCarte" allow="clipboard-write"></iframe>
<div id="bar"><button id="activer" type="button">🔔 Activer les notifications</button></div>
<script>
  // Adresse de l'application Apps Script (celle qui finit par /exec)
  var URL_APPLICATION = "https://script.google.com/macros/s/AKfycbyiw7z5LbH2JO7RiUzjbNy31Fb1CDR7-u5dyBsI-gyTbCSr1AkkdM_wlFFMyjYcx5o1gw/exec";
  document.getElementById("app").src = URL_APPLICATION;
</script>
<!-- Notifications push (OneSignal) -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  var ONESIGNAL_APP_ID = "85919645-3921-4ed7-94f8-f23fc718f0bb";   // public (ce n'est pas la clé API)
  var base = location.pathname.replace(/[^\/]*$/, "");              // "/" ou "/nom-du-depot/"
  var idEnAttente = null;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({
      appId: ONESIGNAL_APP_ID,
      serviceWorkerPath: base.slice(1) + "OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: base }
    });
    var bar = document.getElementById("bar");
    var maj = function () { bar.style.display = (idEnAttente && !OneSignal.Notifications.permission) ? "block" : "none"; };
    document.getElementById("activer").onclick = async function () { await OneSignal.Notifications.requestPermission(); maj(); };
    window.addEventListener("message", async function (ev) {
      var d = ev.data;
      if (!d || typeof d !== "object" || !d.rso7push) return;
      if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(ev.origin)) return;   // seulement Google Apps Script
      if (d.rso7push === "login" && /^[aj][A-Za-z0-9_-]{1,60}$/.test(String(d.id))) {
        idEnAttente = d.id;
        await OneSignal.login(d.id);
        maj();
      } else if (d.rso7push === "logout") {
        idEnAttente = null;
        await OneSignal.logout();
        maj();
      }
    });
  });
</script>
</body>
</html>
